[package]
name = "frontal-web-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
axum = "0.8"
frontal-sdk = { path = "../.." }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
