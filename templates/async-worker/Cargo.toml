[package]
name = "frontal-worker-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[dependencies]
frontal = { path = "../..", default-features = false, features = ["agents"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
