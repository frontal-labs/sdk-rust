[package]
name = "frontal-cli-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
frontal-sdk = { path = "../.." }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
