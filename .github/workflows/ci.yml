name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: Check minimum supported Rust version
        run: cargo check --all-targets --all-features
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
      - name: Check contract files
        run: python3 scripts/check_contracts.py
      - name: Check application templates
        run: cargo check --manifest-path templates/Cargo.toml --workspace
      - name: Format application templates
        run: cargo fmt --manifest-path templates/Cargo.toml --all -- --check
      - name: Lint application templates
        run: cargo clippy --manifest-path templates/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test application templates
        run: cargo test --manifest-path templates/Cargo.toml --workspace
