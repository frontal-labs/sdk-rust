name: Publish to crates.io

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/frontal
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Validate release tag and detect bootstrap version
        id: preflight
        shell: bash
        run: |
          package_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match frontal $package_version" >&2
            exit 1
          fi

          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/frontal/$package_version")
          case "$status" in
            200)
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "frontal $package_version is already on crates.io; skipping duplicate publish."
              ;;
            404)
              echo "already_published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io API status: $status" >&2
              exit 1
              ;;
          esac
      - name: Package crate
        run: cargo package --locked --package frontal
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: target/package/frontal.cdx.json
          syft-version: v1.54.1
          upload-artifact: false
      - name: Upload SBOM for this release run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontal-${{ github.ref_name }}-sbom
          path: target/package/frontal.cdx.json
          if-no-files-found: error
      - name: Attest crate build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/package/frontal-*.crate
      - name: Attest SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/package/frontal-*.crate
          sbom-path: target/package/frontal.cdx.json
      - name: Authenticate with crates.io trusted publishing
        if: steps.preflight.outputs.already_published != 'true'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish crate
        if: steps.preflight.outputs.already_published != 'true'
        run: cargo publish --locked --package frontal
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
