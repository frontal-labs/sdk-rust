name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # Enable CODE_SECURITY_ENABLED after turning on GitHub Code Security for a private repository.
    if: ${{ !github.event.repository.private || vars.CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: moderate
