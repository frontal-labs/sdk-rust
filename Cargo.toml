[package]
name = "frontal"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sdk-rust"
description = "Async Rust SDK for the Frontal API"
readme = "README.md"
keywords = ["frontal", "api", "sdk", "client"]
categories = ["api-bindings", "web-programming"]
exclude = [
    ".cargo/**", ".claude/**", ".cursor*", ".github/**", ".env.example",
    ".gitattributes", ".gitleaks.toml", ".gitmessage", "AGENTS.md", "PLAN.md",
    "SKILL.md", "clippy.toml", "commitlint.config.cjs", "context7.json", "deny.toml",
    "lefthook.yml", "mcp.json", "package.json", "rust-toolchain.toml", "rustfmt.toml",
    "skills/**",
]

[workspace]
members = ["xtask"]
resolver = "2"

[features]
default = ["full"]
full = [
    "ai", "agents", "audit", "auth", "billing", "blob", "connectors", "data",
    "governance", "lineage", "observability", "ontology", "pipelines",
    "schedules", "webhooks", "workflows", "stream",
]
ai = []
agents = []
audit = []
auth = []
billing = []
blob = []
connectors = []
data = []
governance = []
lineage = []
observability = []
ontology = []
pipelines = []
schedules = []
webhooks = []
workflows = []
stream = ["dep:eventsource-stream", "dep:futures-util"]

[lib]
path = "src/lib.rs"

[[test]]
name = "client"
path = "tests/client.rs"
required-features = ["full"]

[[example]]
name = "list_agents"
path = "examples/list_agents.rs"
required-features = ["agents"]

[dependencies]
eventsource-stream = { version = "0.2", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
# Pin these semver-compatible transitive versions so Rust 1.75 remains usable.
hyper-rustls = { version = "=0.27.7", default-features = false }
hyper-util = "=0.1.20"
httpdate = "1"
idna = "=1.1.0"
indexmap = "=2.11.4"
percent-encoding = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
url = "=2.5.8"
zeroize = "=1.8.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "=0.6.5"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
