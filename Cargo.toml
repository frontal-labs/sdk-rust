[package]
name = "frontal-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/frontal-labs/sdk-rust"
description = "Rust client library for the Frontal API"
readme = "README.md"
keywords = ["frontal", "api", "sdk", "client"]
categories = ["api-bindings", "web-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = "warn"
